* {

html, body {

body {
    overflow-x: hidden;
}

/* =========================
   FONDO
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255, 80, 170, 0.08),
            transparent 35%

            rgba(180, 50, 140, 0.06),

}

/* =========================
   PANTALLA
========================= */

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   INTRO
========================= */

#intro {
    flex-direction: column;
    text-align: center;
    padding: 30px;
}

    font-size: clamp(20px, 4vw, 30px);

    line-height: 1.9;

    white-space: pre-line;

    min-height: 250px;
}

.cursor {

    display: inline-block;

    width: 2px;

    height: 1em;

    background: #ff9dcc;

    margin-left: 3px;

    animation: blink 0.8s infinite;
}

@keyframes blink {

        opacity: 0;
    }

}

#accept {

    margin-top: 30px;

    padding: 13px 35px;

    border-radius: 30px;

    border: 1px solid #ff9dcc;

    background: transparent;

    cursor: pointer;

}

#accept:hover {

}


/* =========================
   HISTORIA
========================= */

#story {

    display: none;

    width: 100%;
}

.part {

    min-height: 100vh;

    padding: 60px 25px;

    display: none;

    justify-content: center;

    align-items: center;

    text-align: center;
}

.part.active {

}

.part-content {

}

.part-text {

    font-size: clamp(18px, 3vw, 25px);

    line-height: 2;

    white-space: pre-line;
}


/* =========================
   SCREAMER
========================= */

#screamer {

    display: none;

    position: fixed;

    inset: 0;

    background: #000;

    z-index: 100;

    justify-content: center;

    align-items: center;

    height: 100%;

/* =========================
   ENCUESTA
========================= */

    position: fixed;

    inset: 0;

    background: #000;

    z-index: 90;

    overflow-y: auto;

    padding: 40px 20px;

.question {

    line-height: 1.6;

#result {

    margin-top: 30px;

/* =========================
   FINAL
========================= */

    inset: 0;

    background: #000;

    justify-content: center;

    align-items: center;

    max-height: 90%;

/* =========================
   TRANSICIÓN
========================= */

.fadeOut {

    animation: fadeOut 0.7s forwards;
}

@keyframes fadeOut {

    to {
        opacity: 0;
    }

</style>

/* ==================================================
   ESCRIBIR TEXTO
================================================== */

function escribirTexto(elemento, texto) {

    return new Promise(resolve => {

        elemento.innerHTML = "";

        let i = 0;


        const cursor =
            document.createElement("span");

        cursor.className = "cursor";


        elemento.appendChild(cursor);



        function escribir() {

            if (i >= texto.length) {

                cursor.remove();

                resolve();

                return;
            }


            cursor.before(
                document.createTextNode(
                    texto[i]
                )
            );


            i++;


            setTimeout(
                escribir,
                velocidadTexto
            );

        }


        escribir();

    });

}



/* ==================================================
   ESPERAR
================================================== */

function esperar(ms) {

    return new Promise(resolve => {

        setTimeout(resolve, ms);

    });

}



/* ==================================================
   INICIO
================================================== */

async function iniciar() {

    await escribirTexto(

}

            ".part"
        );


    partes.forEach(parte => {

        parte.classList.remove(
            "active"

    });



    const parte =
        document.getElementById(
            "part" + numero

    parte.classList.add(

    const texto =
        parte.querySelector(
            ".part-text"

        await mostrarParte(8);

    /*
       SIGUIENTE PARTE
    */

        );

}



/* ==================================================
   SCREAMER
================================================== */

async function ejecutarScreamer() {


    /*
       Guardamos el segundo exacto
       donde quedó la canción.
    */

    const posicion =
        musicaActual.currentTime;



    /*
       Pausamos la canción principal.
    */

    musicaActual.pause();



    story.style.display =
        "none";


    screamer.style.display =
        "flex";



    /*
       Sonido del screamer.
    */

    screamerAudio.currentTime = 0;

    screamerAudio
        .play()
        .catch(() => {});



    /*
       Esperamos a que termine.
    */

    await new Promise(resolve => {

        screamerAudio.addEventListener(
            "ended",
            resolve,
            {
                once: true
            }
        );

    });



    screamerAudio.currentTime = 0;



    /*
       Quitamos screamer.
    */

    screamer.style.display =
        "none";


    story.style.display =
        "block";



    /*
       Continuamos la canción
       exactamente donde estaba.
    */

    musicaActual.currentTime =
        posicion;

    musicaActual
        .play()
        .catch(() => {});

}



/* ==================================================

async function ejecutarQuiz() {

                if (
                    preguntaActual <
                    preguntas.length
                ) {

                    preguntas[
                        preguntaActual
                    ].classList.add(
                        "active"
                    );

                }



                /*
                   Ya terminó la encuesta.
                */

                else {

                    await esperar(500);


                    if (
                        window.finalizarQuiz
                    ) {

                        window.finalizarQuiz();

                    }

                }

            }
        );

    });



/* ==================================================
   FINAL
================================================== */

function mostrarFinal() {

    story.style.display =
        "none";


    final.style.display =
        "flex";

}

</script>
